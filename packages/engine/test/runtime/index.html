<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kite3D runtime fixture</title>
    <script type="importmap">
    {"imports":{
        "threepipe":"./runtime.js",
        "three":"./runtime.js",
        "uiconfig.js":"./runtime.js",
        "ts-browser-helpers":"./runtime.js",
        "@kite3d/engine":"./runtime.js"
    }}
    </script>
    <style>
        html, body, canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    </style>
</head>
<body>
    <canvas id="kite3d-canvas"></canvas>
    <script type="module">
        import {createGame, RUNTIME_VERSION} from './runtime.js'

        window.__kite3dUpdates = 0
        window.__kite3dErrors = []
        window.__kite3dRuntimeVersion = RUNTIME_VERSION
        try {
            window.__kite3dGame = await createGame({
                base: new URL('./sample-project/', location.href).href,
                canvas: document.getElementById('kite3d-canvas'),
                onError: (error) => window.__kite3dErrors.push(String(error)),
            })
        } catch (error) {
            window.__kite3dStartupError = String(error)
        } finally {
            window.__kite3dReady = true
        }
    </script>
</body>
</html>
