name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10's CI/prepare handling is incompatible with the vendored workspaces; npm 11 install keeps resolution and scripts stable.
      - run: npm install --global npm@11.19.0
      - run: npm install --ignore-scripts
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run test:scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:editor
      - name: Publish, register runtime, and upload agents guide
        run: node scripts/release.mjs --publish --register
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RUNTIME_UPLOAD_TOKEN: ${{ secrets.RUNTIME_UPLOAD_TOKEN }}
          BLITZ_BACKEND_URL: ${{ secrets.BLITZ_BACKEND_URL }}
