name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10's CI/prepare handling is incompatible with the vendored workspaces; npm 11 install keeps resolution and scripts stable.
      - run: npm install --global npm@11.19.0
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:kite3d
      - run: npx playwright install --with-deps chromium
      - run: npm run test:runtime
      - run: npm run test:editor
